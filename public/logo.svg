<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1f36;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a017;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Dove / Holy Spirit wings (simplified) -->
  <g filter="url(#glow)" opacity="0.15">
    <ellipse cx="256" cy="180" rx="80" ry="30" fill="#f0c040" transform="rotate(-15, 256, 180)"/>
    <ellipse cx="256" cy="180" rx="80" ry="30" fill="#f0c040" transform="rotate(15, 256, 180)"/>
  </g>
  
  <!-- Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="238" y="110" width="36" height="200" rx="4" fill="url(#crossGrad)"/>
    <!-- Horizontal bar -->
    <rect x="180" y="160" width="152" height="36" rx="4" fill="url(#crossGrad)"/>
    <!-- Cross center jewel -->
    <circle cx="256" cy="178" r="12" fill="#1e3a5f" stroke="#f0c040" stroke-width="2"/>
    <circle cx="256" cy="178" r="5" fill="#f0c040"/>
  </g>
  
  <!-- Open Bible below cross -->
  <g filter="url(#shadow)" transform="translate(256, 340)">
    <!-- Left page -->
    <path d="M-5,-20 Q-50,-25 -55,5 L-5,0 Z" fill="#f5f0e0" stroke="#d4a017" stroke-width="1"/>
    <!-- Right page -->
    <path d="M5,-20 Q50,-25 55,5 L5,0 Z" fill="#f5f0e0" stroke="#d4a017" stroke-width="1"/>
    <!-- Page lines -->
    <line x1="-40" y1="-15" x2="-10" y2="-12" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-42" y1="-10" x2="-10" y2="-7" stroke="#aaa" stroke-width="0.8"/>
    <line x1="-43" y1="-5" x2="-10" y2="-2" stroke="#aaa" stroke-width="0.8"/>
    <line x1="10" y1="-12" x2="40" y2="-15" stroke="#aaa" stroke-width="0.8"/>
    <line x1="10" y1="-7" x2="42" y2="-10" stroke="#aaa" stroke-width="0.8"/>
    <line x1="10" y1="-2" x2="43" y2="-5" stroke="#aaa" stroke-width="0.8"/>
  </g>
  
  <!-- Outer decorative arc -->
  <path d="M120,400 Q256,440 392,400" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>
  
  <!-- Church name text path -->
  <text x="256" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#d4a017" font-weight="bold" letter-spacing="3">
    CACGM
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" fill="#a0a8b8" letter-spacing="1.5">
    CHRIST APOSTOLIC CHURCH
  </text>
  <text x="256" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" fill="#a0a8b8" letter-spacing="1.5">
    OF GOD MISSION
  </text>
  
  <!-- Small stars -->
  <g fill="#f0c040" opacity="0.5">
    <polygon points="130,130 132,136 138,136 133,140 135,146 130,142 125,146 127,140 122,136 128,136" transform="scale(0.6) translate(100,80)"/>
    <polygon points="130,130 132,136 138,136 133,140 135,146 130,142 125,146 127,140 122,136 128,136" transform="scale(0.5) translate(600,100)"/>
    <polygon points="130,130 132,136 138,136 133,140 135,146 130,142 125,146 127,140 122,136 128,136" transform="scale(0.4) translate(200,200)"/>
  </g>
</svg>
